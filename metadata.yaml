name: backup_storage
desc: 本地文件备份储存插件 - 支持定时备份、多路径监控、自动转发到群聊
help: |
  本地文件备份储存插件

  【功能说明】
  - 手动备份：保存文件到本地备份目录
  - 查看备份：列出已备份的文件（显示序号）
  - 删除备份：根据序号删除备份文件
  - 转发备份：根据序号将备份文件发送到群聊
  - 查看待转发：查看待转发队列
  - 执行转发：将待转发队列中的文件发送到当前群聊
  - 备份历史：查看备份历史记录
  - 备份状态：查看插件运行状态

  【高级功能】
  - ⏰ 定时备份：按设定间隔自动备份监控目录中的新文件
  - 📁 多路径监控：支持配置多个监控路径
  - 🚀 自动转发：备份完成后自动加入待转发队列，用户手动执行转发

  【使用命令】
  - /备份文件 [文件路径] [自定义名称?] - 手动备份文件
  - /查看备份 - 列出所有备份文件（显示序号方便操作）
  - /删除备份 [序号] - 根据序号删除备份文件
  - /转发备份 [序号] - 根据序号将备份文件发送到群聊
  - /查看待转发 - 查看待转发队列
  - /执行转发 - 将待转发队列中的文件发送到当前群聊
  - /备份历史 [条数?] - 查看备份历史记录
  - /备份状态 - 查看插件运行状态

  【序号系统】
  使用序号代替文件名，操作更方便快捷！

  【自动转发流程】
  定时备份 → 加入待转发队列 → 用户执行 /执行转发 → 文件发送到当前群聊

  【注意】
  - 插件会自动创建备份目录
  - 支持图片、视频、音频、文档等各类文件
  - 配置定时备份和多路径监控需要在插件设置中启用
version: v2.2.0
